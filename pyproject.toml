[project]
name = "hf-cloud"
version = "0.1.0"
description = "Manage Hugging Face model deployments across cloud providers directly from the hf CLI."
readme = "README.md"
authors = [
    {name = "Enrique Hernández Calabrés", email = "ehcalabres@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.21.1",
    "pydantic>=2.12.5",
    "huggingface-hub>=1.3.4",
    "rich>=13.9.4",
    "boto3>=1.42.36",
    "sagemaker>=3.4.0",
    "google-cloud-aiplatform>=1.135.0",
    "google-cloud-logging>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.10"}

[tool.ruff]
line-length = 112

[tool.ruff.lint]
select = ["I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false

[project.scripts]
hf-cloud = "hf_cloud.cli:main"
